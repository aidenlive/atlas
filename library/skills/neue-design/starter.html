<!doctype html>
<!-- ============================================================
     NEUE — blank starter
     Copy this file, change the title, write inside <main>.
     The two <link>/<script> lines to dist/ are the entire install;
     keep dist/ and fonts/ as siblings.
     ============================================================ -->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Untitled · Neue</title>

  <link rel="stylesheet" href="dist/neue.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/fill/style.css">
  <script src="dist/neue.js" defer></script>
</head>
<body class="neue-base">
<a class="n-skip" href="#main">Skip to content</a>

<div class="n-navrow">
  <div class="n-island n-island--brand">
    <strong class="t-label-lg">Neue</strong>
  </div>
  <nav class="n-island n-island--nav" aria-label="Primary">
    <a class="n-navlink" aria-current="page" href="#">Overview</a>
    <a class="n-navlink" href="#">Data</a>
    <a class="n-navlink" href="#">Settings</a>
  </nav>
  <div class="n-island n-island--actions">
    <button class="n-btn n-btn--icon n-btn--sm" aria-label="Search">
      <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
    </button>
    <button class="n-btn n-btn--icon n-btn--sm" data-theme-toggle aria-label="Toggle theme">
      <i class="ph ph-moon" aria-hidden="true"></i>
    </button>
  </div>
</div>

<main id="main" tabindex="-1" class="l-container" style="padding-block: var(--s-9)">
  <div class="l-stack" style="--gap: var(--s-4)">
    <p class="t-caption t-muted">Untitled</p>
    <h1 class="t-display">A blank page.</h1>
    <p class="t-body-lg t-secondary l-center" style="margin-inline: 0; max-width: var(--measure-narrow)">
      Write inside main. Prose stays under the measure; sections take their
      rule from the container.
    </p>
  </div>
</main>

</body>
</html>
